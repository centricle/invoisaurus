# The hosted demo. Not how the local tool runs -- see README.
#
# The app is one Express process wrapped in a Netlify function
# (netlify/functions/app.js); public/ is staged into dist/ by
# scripts/build-static.mjs so the CDN serves the static assets and only real
# pages reach the function.
#
# Nothing here is specific to a particular site. Fork it, point a Netlify
# project at it, and you get a working demo at the root of your own domain.
#
# To serve it under a path prefix instead -- the way this project's own demo is
# proxied under a path on another site -- set BASE_PATH as a project
# environment variable:
#
#   netlify env:set BASE_PATH "/some/prefix"
#
# Not in [build.environment] below, deliberately: variables set there are
# build-time only, and this one has to reach the function at runtime too.
# Project environment variables reach both.

[build]
  command = "npm run css:build && node scripts/build-static.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"
  # The EJS templates are read at runtime by fs.readFileSync in
  # src/viewEngine.js, so nothing in the import graph mentions them and the
  # tracer leaves them behind. The deploy then builds green and 500s on the
  # first page it is asked for.
  #
  # The exclusion is the important half. src/config.js contains
  # `path.join(ROOT, 'data')` as the default data directory, and the tracer
  # resolves that expression statically and packages the whole directory --
  # which on a working machine is the operator's real invoice records, client
  # addresses and all, plus any git repo inside it. .gitignore does not apply
  # here: it governs git, not Netlify's bundler, so nothing about the repo
  # being clean says anything about what ships in the artifact.
  #
  # Verify rather than trust: `npm run check:bundle`.
  included_files = ["src/views/**", "!data/**", "!tmp/**", "!docs/**"]

# Everything the CDN did not already answer from dist/. Not forced, so a real
# file always wins -- that is what keeps CSS and JS off the function.
#
# The bare origin needs no rule here. With no BASE_PATH the app already serves
# at the root; with one, server.js redirects the root to the prefix, so the
# behavior travels with the app instead of living in this file.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
