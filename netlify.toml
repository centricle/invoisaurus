# The hosted demo. Not how the local tool runs -- see README.
#
# The app is one Express process wrapped in a function (netlify/functions/app.mjs);
# public/ is staged into dist/ by scripts/build-static.mjs so the CDN serves the
# static assets and only real pages reach the function.
#
# Reached at https://centricle.com/etc/invoisaurus, proxied from the centricle
# site with the path preserved. BASE_PATH below has to match the prefix in that
# proxy rule, or every link on every page points somewhere that does not exist.

[build]
  command = "npm run css:build && node scripts/build-static.mjs"
  publish = "dist"
  functions = "netlify/functions"

# Build-time only. Functions cannot read these at runtime, which is why
# netlify/functions/app.mjs sets its own copies -- see the note there before
# changing either. BASE_PATH is here because the build stages files into a
# directory named after it.
[build.environment]
  BASE_PATH = "/etc/invoisaurus"

[functions]
  node_bundler = "nft"
  # The EJS templates are read at runtime by fs.readFileSync in
  # src/viewEngine.js, so nothing in the import graph mentions them and the
  # tracer leaves them behind. The deploy then builds green and 500s on the
  # first page it is asked for.
  #
  # The exclusion is the important half. src/config.js contains
  # `path.join(ROOT, 'data')` as the default data directory, and nft resolves
  # that expression statically and packages the whole directory -- which on a
  # working machine is the operator's real invoice records, client addresses
  # and all, plus the private git repo inside it. .gitignore does not apply
  # here: it governs git, not Netlify's bundler, so nothing about the repo
  # being clean says anything about what ships in the artifact.
  #
  # Verify rather than trust: `npm run check:bundle`.
  included_files = ["src/views/**", "!data/**", "!tmp/**", "!docs/**"]

# Everything the CDN did not already answer from dist/. Not forced, so a real
# file always wins -- that is what keeps CSS and JS off the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
